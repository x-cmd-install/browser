abel":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":16244,"digest":"sha256:1cff5c5d9b00cff20077609bdb719c198c95446c4d2a7af00cc65aeaf4009dac","download_count":18,"created_at":"2026-11-13T11:59:27Z","updated_at":"2026-11-13T11:59:27Z"},{"id":743488722,"node_id":"RA_kwDOI67vws4sULzS","name":"lightpanda-x86_64-linux","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":77649224,"digest":"sha256:7d22651129901203abdb95c64f49069c49e88f5211f4d8c4c6828c123c4adab4","download_count":270,"created_at":"2026-11-13T11:59:20Z","updated_at":"2026-11-13T11:59:24Z"},{"id":743488873,"node_id":"RA_kwDOI67vws4sUL1p","name":"lightpanda-x86_64-linux.debug","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":48392000,"digest":"sha256:3840870747b4cb87be076668b866c33990354374beb5111d33f3f5e38caf7b2f","download_count":8,"created_at":"2026-11-13T11:59:24Z","updated_at":"2026-11-13T11:59:26Z"},{"id":743478037,"node_id":"RA_kwDOI67vws4sUJMV","name":"lightpanda-x86_64-macos","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":95723332,"digest":"sha256:8c02127c6fc2a713d166349bf1b511d470c8fcd684681927c978cc8bb5952d55","download_count":24,"created_at":"2026-11-13T11:55:49Z","updated_at":"2026-11-13T11:55:53Z"},{"id":743492285,"node_id":"RA_kwDOI67vws4sUMq9","name":"lightpanda_1.0.4_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":20104424,"digest":"sha256:978da22bcc97dceca7bc831f49b4d459a1f96d85cb43360c75d35c8a85a325bb","download_count":22,"created_at":"2026-11-13T12:00:31Z","updated_at":"2026-11-13T12:00:32Z"},{"id":743491979,"node_id":"RA_kwDOI67vws4sUMmL","name":"lightpanda_1.0.4_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":17929808,"digest":"sha256:b466143a4eaa77640f9406d9966f939067eefc329a16a2c8278f7fb90c744b67","download_count":11,"created_at":"2026-11-13T12:00:25Z","updated_at":"2026-11-13T12:00:26Z"}],"body":"## Behavior changes\r\n- Requests to the Fetch \"bad ports\" (ssh, smtp, pop3, imap, …) are now refused for every request, not only WebSocket.\r\n- `window.postMessage` now honors `targetOrigin`.\r\n- A cross-site response can no longer set a `SameSite` cookie other than `None`.\r\n- Proxy and server credentials are tracked separately, so proxy credentials are no longer sent to the server after a redirect.\r\n- An `about:blank` (or src-less) iframe now gets its `contentWindow` and `contentDocument` even without `--load-resources iframe`. Its HTTP and WebSocket requests are blocked while iframe loading is off.\r\n- An HTTP status from 600 to 999 (e.g. LinkedIn's `999`) is now reported as-is instead of `0`.\r\n- Trusted `mousedown`, `mouseup`, `click` and `dblclick` now stop at the first disabled form control, as in Chrome.\r\n- Element clicks and hovers from tools now hit the element's center instead of `(0, 0)`.\r\n- `document.readyState` is now `interactive` when deferred scripts run.\r\n- `Network.setUserAgentOverride` now logs a warning when a restricted user agent is ignored.\r\n- The HTTP server parses requests more strictly and its routes are guarded against DNS rebinding.\r\n\r\n## CDP\r\n- Several page targets in one browser context. Console, exception and network events are routed to the right target, and a frame id from another target is rejected\r\n- Accessibility: `ignoredReasons` now match Chrome (`ariaHiddenElement`, `ariaHiddenSubtree`, `inertElement`, `notRendered`, `notVisible`)\r\n- Lone surrogate escapes in JSON (`\"\\udc00\"`) are accepted instead of closing the connection\r\n- `LP.waitUntil` and a `settled` lifecycle event\r\n- `beacon` added to `LP.configureLoading`\r\n- A closed browser context no longer leaves its viewport override for the next one\r\n- `LP` commands described in `/json/protocol`\r\n\r\n## Serve / CLI\r\n- `--wait-until settled` (experimental): waits for load, then for the work that can still change the page. Interval timers, long timers and intersection observers don't hold it\r\n- `--v8-gc-hint-floor-mb` replaces the fixed 1 MiB GC hint floor. Off in `fetch`\r\n- `--experimental-features animation`: fire `animationstart`, `animationend` and `animationcancel` for CSS animations\r\n- Bash 3.2 (macOS) filename completion\r\n\r\n## New Web APIs\r\n- `AnimationEvent` and CSS animation events (behind `--experimental-features animation`)\r\n- `ClipboardEvent`\r\n- `InputEvent.getTargetRanges()`\r\n- `execCommand('insertParagraph')`\r\n- `getComputedStyle().content` resolved from the cascade\r\n\r\n## Web API behavior / fixes\r\n- Text editors: CKEditor works, and clicks, focus and Tab place the caret in a `contenteditable` (Slate, Draft.js)\r\n- `contenteditable`: Backspace and Delete merge blocks (nested ones too), side-by-side lists merge, Enter in an empty list item outdents it\r\n- `execCommand`: runs of spaces and spaces at line edges become `&nbsp;`, so they stay visible\r\n- `innerText` keeps spaces when CSS `white-space` preserves them, and puts a newline between rows of `thead`, `tbody` and `tfoot`\r\n- `:defined` follows the custom element state; customized built-ins (`<button is=...>`) now upgrade\r\n- `[CEReactions]` for `createElement`/`createElementNS`; the reactions queue is no longer drained when a constructor returns\r\n- `a.hash` and `a.search` (and `<area>`) return `\"\"` for a lone `#` or `?`\r\n- `history.pushState(undefined)` no longer breaks `history.state`; state that JSON can't encode throws `DataCloneError`\r\n- `import()` of an already available module settles in a later task, as in Chrome\r\n- `window.<id>` on an iframe's window looks up the iframe's document\r\n- Functions called from a realm whose frame is gone no longer crash (`import()`, `import.meta`, `postMessage`, `location`)\r\n- WebSocket: fragmented messages are reassembled; the server's `Sec-WebSocket-Protocol` is checked against the offered list\r\n- CORS responses filter their headers\r\n- `Response.clone()` on a stream; `pipeTo`/`pipeThrough` fixes\r\n- Input `stepUp`/`stepDown` with fractional steps (`0.1 + 0.2` gives `0.3`)\r\n- `matchMedia(\"\")` always matches\r\n- SVG `getCTM()`/`getScreenCTM()` return an identity matrix on a detached element\r\n- `frame` and `basefont` are serialized as void elements\r\n- `document.createEvent('inputevent')` is rejected; `PromiseRejectionEvent` requires its options\r\n- `new CSSStyleSheet()` sheets are the only ones `replace()` accepts\r\n- `IntersectionObserver`: the first check runs on the next tick\r\n\r\n## Tools / MCP\r\n- `tree` `delta: true`: returns only the lines that changed since the last call\r\n- The page's WebMCP tools are reported in a tool result whenever they change\r\n- Actions that open a window late (after a fetch or a timer) now follow it; new `popups` tool lists and switches windows\r\n- `click` says when the element is disabled or not rendered\r\n- Tool arguments are type-checked, and every error names the argument and the problem\r\n- `tree` and `markdown` keep content that is rendered despite `hidden` or `aria-hidden`\r\n- Markdown: `<ol start>`, multi-paragraph blockquotes, a blank line before `---`\r\n- MCP over HTTP: tool output streamed over SSE (the `run` tool streams console lines), `logging/setLevel`, and `notifications/cancelled` now stops the call in flight\r\n- The `run` tool description explains how to load pages in parallel\r\n\r\n## Performance / stability\r\n- Style caches are invalidated per property group, and a geometry change no longer resets the whole geometry cache\r\n- Smaller CSS declarations (~500 KB saved on a style-heavy site); property names are ids, and style matching compares ids (7%+ faster rebuilds on most frameworks)\r\n- XHR takes the response body instead of copying it\r\n- XPath parsing allocates less\r\n- Crash fixes: abort during a gated transfer, a UAF in custom element upgrade\r\n- The crash reporter exits non-zero when it can't start `curl`\r\n\r\n## Release\r\n- macOS builds run on macOS 15; the Intel build targets baseline x86_64, fixing \"Illegal instruction\" on older CPUs\r\n- Release candidates (`1.0.4-rc1`) are now published","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
