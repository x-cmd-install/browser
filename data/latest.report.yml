label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":17081,"digest":"sha256:bc9288b2d651e8eea01345467fbe48e62f32ed632d45ab0f911ba02ea7f7572a","download_count":16,"created_at":"2026-11-27T12:04:03Z","updated_at":"2026-11-27T12:04:03Z"},{"id":800329252,"node_id":"RA_kwDOI67vws4vtA4k","name":"lightpanda-x86_64-linux","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":76649800,"digest":"sha256:a9bff4c0b8498433cd16d8165a5e5b47181e5690d4c8e1f011d601f1f2e8a467","download_count":1817,"created_at":"2026-11-27T12:03:56Z","updated_at":"2026-11-27T12:03:59Z"},{"id":800329432,"node_id":"RA_kwDOI67vws4vtA7Y","name":"lightpanda-x86_64-linux.debug","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":48168040,"digest":"sha256:b6f0a7309e2f2eb8ab0e516303e606836e5925356dae48e963c1085709f4ae7f","download_count":13,"created_at":"2026-11-27T12:04:00Z","updated_at":"2026-11-27T12:04:02Z"},{"id":800313313,"node_id":"RA_kwDOI67vws4vs8_h","name":"lightpanda-x86_64-macos","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":94759402,"digest":"sha256:d2bb233b444a075057cd48a1da88d45c640e292a9de85ceff026793b091e126d","download_count":25,"created_at":"2026-11-27T11:58:53Z","updated_at":"2026-11-27T11:58:57Z"},{"id":800332015,"node_id":"RA_kwDOI67vws4vtBjv","name":"lightpanda_1.0.6_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":20032876,"digest":"sha256:5a25f01ff39608fcdb6e7db6650fb145aef69b463b1598b0ee3266734e6b5b23","download_count":36,"created_at":"2026-11-27T12:04:48Z","updated_at":"2026-11-27T12:04:49Z"},{"id":800332017,"node_id":"RA_kwDOI67vws4vtBjx","name":"lightpanda_1.0.6_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":17929420,"digest":"sha256:36828d3cca19562d598d956375a88e9100e00b8087b7694e7ae7a0d086f173a1","download_count":28,"created_at":"2026-11-27T12:04:48Z","updated_at":"2026-11-27T12:04:49Z"}],"body":"## Behavior changes\r\n- Screenshots now use the layout engine: `Page.captureScreenshot`, BiDi screenshots and `fetch --dump png` draw boxes where `getBoundingClientRect` puts them. `--png-mode reader` gives the old one-column text rendering. The agent's `/screenshot` keeps `reader` by default (`mode=` to change it). PDF is always `reader`.\r\n- `Page.getLayoutMetrics` now comes from the layout engine, and the root container is as wide as the viewport instead of a fixed 1920px.\r\n- CORS: a `*` in `Access-Control-Allow-Headers` now covers `Authorization`, as every browser does.\r\n- A response with no declared charset that is clearly not UTF-8 is decoded as windows-1252.\r\n- CDP: `DOM`, `CSS`, `Accessibility` and `Input` commands (other than `enable`/`disable`) now fail on the startup placeholder target.\r\n\r\n## Serve / CLI\r\n- `--cdp-allow-timezone-override`: lets `Emulation.setTimezoneOverride` change the time zone used by `Date` and `Intl`. The zone is shared by the whole process. Without the flag, the command is accepted and ignored with a warning\r\n- `--png-mode layout|reader` for `fetch --dump png`\r\n- `agent --temperature <FLOAT>`\r\n\r\n## Layout\r\n- Padding and `box-sizing`\r\n- Margins move boxes horizontally; `margin: 0 auto` centers, `margin-left: auto` pushes right\r\n- `gap`, `row-gap` and `column-gap` in flex layouts; text between flex items counts as an item\r\n- `bottom` sizes a fixed or absolute box\r\n- Every `z-index` value is used for hit testing\r\n- `html` and `body` take their declared height (`height: 100%`); `canvas` and `video` without a size are 300×150\r\n- Every `display` value is tracked, for layout and `getComputedStyle`\r\n\r\n## New Web APIs\r\n- `navigator.clipboard.readText()` and `writeText()` (a per-session buffer, never the system clipboard; secure contexts only)\r\n- `HTMLMediaElement` timeline: `duration`, a `currentTime` that advances while playing, seeking, `ended`, `loop` and the matching events (nothing is decoded or played)\r\n- `ReadableStreamDefaultReader.closed`\r\n- `OffscreenCanvas` is an `EventTarget` (Flutter web apps now start)\r\n\r\n## Web API behavior / fixes\r\n- CSS rules inside an `@supports` block are applied when the condition holds\r\n- Streams: `pull()` waits for `start()` and for its own previous call, and runs again when a read waits (fixes Next.js 16 prefetch streams); `cancel()` handles a returned promise, and both `tee()` branches share one cancel promise\r\n- XML parsing keeps namespace declarations (`xmlns`, `xmlns:b`) and creates `CDATASection` nodes\r\n\r\n## CDP\r\n- `Emulation.setTimezoneOverride` applies the zone (with `--cdp-allow-timezone-override`) and rejects unknown zone ids\r\n- `LP.detectForms` `includeValidation` option: returns each field's validation message\r\n\r\n## BiDi\r\n- `script.addPreloadScript`\r\n- `script.getRealms`\r\n- `browsingContext.captureScreenshot`\r\n- `browsingContext.handleUserPrompt`, and a new `lp.handleUserPrompt`, like CDP's `LP.handleJavaScriptDialog`\r\n\r\n## Tools / MCP\r\n- `detectForms` `includeValidation` option: returns each field's validation message, so an agent can read why a form was rejected\r\n\r\n## Performance / memory\r\n- Startup no longer loads every CA certificate twice (about 30% of a simple `fetch`)\r\n- Semantic tree dumps register far fewer nodes (HTML spec: 672k → 314k)\r\n- `getBoundingClientRect` and other `DOMRect` returns skip the identity map\r\n- Less memory for the identity map, cloned attributes, inline scripts, selectors, node lists and PNG rendering (drawn 128 rows at a time)\r\n- Faster style matching: better `:where()` bucketing, an ancestor bloom filter, and selectors that can never match are dropped\r\n- A class change that can't move a box no longer clears the layout cache","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
